<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test catalog</title>

<!-- The test catalog viewer (docs/catalog.md). scripts/catalog.mjs replaces the data token below
     with the catalog JSON. Read-only; every data string is untrusted and only ever set as text. -->
<style>
:root{--bg:#fff;--fg:#1d1f23;--dim:#6b7078;--card:#f6f7f9;--line:#e3e5e8;--ok:#127a3a;--okbg:#e3f5e9;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6;--muted:#555b63;--mutedbg:#eceef1;--link:#1a5fb4;--sel:#e8f0fe;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e8eaed;--dim:#9aa0a6;--card:#1e2125;--line:#2e3238;--ok:#6fd58f;--okbg:#173322;--bad:#ff8a80;--badbg:#3a1d1b;--warn:#f5c26b;--warnbg:#3a2f14;--muted:#b0b5bb;--mutedbg:#2a2e33;--link:#8ab4f8;--sel:#1f2a3d;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--line);padding:12px 0 0}
.title{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.title h1{font-size:18px;margin:0}
.meta{color:var(--dim);font-size:12.5px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--dim);white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--link);font-weight:600}
.tabs .sp{flex:1}
main{padding:16px 0 48px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--dim)}
.btn.on{background:var(--sel);border-color:var(--link)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--sel);border-color:var(--link)}
.badge{display:inline-block;border-radius:4px;padding:0 6px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.ok{color:var(--ok);background:var(--okbg)}.warn{color:var(--warn);background:var(--warnbg)}.bad{color:var(--bad);background:var(--badbg)}.muted{color:var(--muted);background:var(--mutedbg)}.none{color:var(--dim);background:transparent;border:1px dashed var(--line)}
.tier{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12px;white-space:nowrap;line-height:1.6}
.tier.regression{border-color:var(--link);color:var(--link)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.token{background:var(--sel);border-radius:3px;padding:0 3px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{color:var(--dim);font-size:12.5px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.panel h2,.panel h3{font-size:14px;margin:0 0 8px}
.att li{margin:4px 0;list-style:none}
.att{padding:0;margin:0}
.linkish{background:none;border:0;padding:0;color:var(--link);cursor:pointer;text-align:left}
.linkish:hover{text-decoration:underline}
svg text{fill:var(--dim);font-size:10px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}
.side details{border-bottom:1px solid var(--line);padding:6px 0}
.side summary{cursor:pointer;font-weight:600;font-size:13px}
.side label{display:flex;gap:6px;align-items:center;font-size:13px;padding:1px 0;cursor:pointer}
.side label .n{margin-left:auto;color:var(--dim);font-size:12px}
.side label.zero{opacity:.45}
.side .more{font-size:12px}
.filters-toggle{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.toolbar select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.count{color:var(--dim);font-size:12.5px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.list{border-collapse:collapse;width:100%;font-size:13px}
table.list th,table.list td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list th{position:sticky;top:0;background:var(--card);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
table.list th .arr{color:var(--link);font-size:11px}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:var(--sel)}
.name{min-width:220px;max-width:420px}
td.nw{white-space:nowrap}
.group{margin-bottom:12px}
.group>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;font-weight:600}
.minibar{display:inline-flex;width:120px;height:8px;border-radius:4px;overflow:hidden;background:var(--mutedbg);vertical-align:middle}
.minibar i{display:block;height:100%}
.minibar .ok,.bar .ok{background:var(--ok)}.minibar .warn,.bar .warn{background:var(--warn)}.minibar .bad,.bar .bad{background:var(--bad)}.minibar .muted,.bar .muted{background:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:var(--dim)}
.card .then{color:var(--dim);font-size:12.5px}
.card img,.gal img{width:100%;display:block;border-radius:6px;border:1px solid var(--line);background:#fff}
.ph{aspect-ratio:16/10;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gal .card img{aspect-ratio:16/10;object-fit:cover;object-position:top}
.more-row{text-align:center;margin:10px 0}
.navgroup{margin-bottom:18px}
.navgroup h3{display:flex;gap:10px;align-items:center;font-size:14px;margin:0 0 8px}
.bar{display:inline-flex;height:8px;width:180px;border-radius:4px;overflow:hidden;background:var(--mutedbg)}
.bar i{display:block;height:100%}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.page{border-radius:8px;border:1px solid var(--line);background:var(--card);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--muted)}
.page.cov-regression{border-left-color:var(--ok)}.page.cov-exploratory{border-left-color:var(--warn)}.page.cov-none{border-left-color:var(--bad)}
.page img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:4px;border:1px solid var(--line);background:#fff}
.heat{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:75vh}
.heat table{border-collapse:separate;border-spacing:2px;font-size:12px}
.heat th{position:sticky;top:0;background:var(--bg);font-weight:500;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg);height:90px;white-space:nowrap;padding:2px}
.heat td.rowh{position:sticky;left:0;background:var(--bg);white-space:nowrap;padding-right:8px;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.heat td.c{width:16px;min-width:16px;height:16px;border-radius:3px}
.heat td.c.ok{background:var(--ok)}.heat td.c.warn{background:var(--warn)}.heat td.c.bad{background:var(--bad)}.heat td.c.muted{background:var(--muted)}.heat td.c.e{background:var(--mutedbg)}
.funnel .row{display:grid;grid-template-columns:200px minmax(0,1fr) 60px;gap:10px;align-items:center;margin:6px 0}
.funnel .fill{height:18px;border-radius:4px;background:var(--link);opacity:.75;min-width:2px}
.cmd{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmd input{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);width:16ch}
#drawer{position:fixed;inset:0 0 0 auto;width:min(620px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow:auto;z-index:20;padding:14px 16px 40px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19}
#drawer h2{font-size:17px;margin:4px 0}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:13px;margin:10px 0}
.dl dt{color:var(--dim)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.gwt{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.gwt p{margin:3px 0}
.gwt b{display:inline-block;width:52px;color:var(--dim);font-weight:600}
.steps{list-style:none;padding:0;margin:8px 0;border-left:2px solid var(--line)}
.steps li{position:relative;padding:3px 0 3px 22px;overflow-wrap:anywhere}
.steps li::before{content:attr(data-k);position:absolute;left:-9px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:9px;text-align:center;line-height:15px;color:var(--dim)}
.steps li.expect{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.hist{display:flex;flex-wrap:wrap;gap:3px}
.hist span{font-size:11px;border-radius:3px;padding:0 5px}
.sec{margin-top:16px}
.sec h3{font-size:13px;margin:0 0 6px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.star{background:none;border:0;cursor:pointer;font-size:16px;line-height:1;color:var(--dim);padding:0 2px}
.star.on{color:#e3a008}
#legend{position:fixed;right:16px;top:60px;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:12px;max-width:min(420px,calc(100% - 32px));max-height:80vh;overflow:auto}
#legend ul{list-style:none;padding:0;margin:6px 0}
#legend li{margin:3px 0}
.empty{padding:40px 0;text-align:center;color:var(--dim)}
.close{float:right}
.muted-t{color:var(--dim)}
.asof{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warnbg);color:var(--warn);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:12px;font-size:13px}
.tabs select{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px 6px;margin:4px 6px;max-width:220px}
.maplayout{display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:16px;align-items:start}
.pagelist{max-height:78vh;overflow:auto}
.pagelist h4{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px}
.pagelist button{display:flex;gap:6px;align-items:center;width:100%;background:none;border:0;border-radius:6px;padding:4px 6px;cursor:pointer;text-align:left}
.pagelist button:hover{background:var(--card)}
.pagelist button[aria-current=true]{background:var(--sel)}
.pagelist .n{margin-left:auto;color:var(--dim);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--bad)}
.dot.regression{background:var(--ok)}.dot.exploratory{background:var(--warn)}
.pagepick{display:none;margin-bottom:8px;max-width:100%}
.stage{position:relative;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.stage img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.stage.wf{background:var(--card);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.hs{position:absolute;border:2px solid var(--muted);border-radius:3px;background:color-mix(in srgb,var(--muted) 14%,transparent);cursor:pointer;padding:0;overflow:hidden;min-width:6px;min-height:6px}
.hs:hover,.hs.sel{outline:3px solid var(--link);outline-offset:1px;z-index:3}
.hs.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.hs.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.hs.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,transparent)}
.hs.none{border:1px dashed var(--dim);background:transparent}
.stage.wf .hs{background:var(--bg)}
.hs span{display:block;font-size:10px;line-height:1.2;padding:1px 3px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.legend-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--dim);margin:8px 0}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;border:2px solid var(--muted);vertical-align:middle;margin-right:4px}
.sw.ok{border-color:var(--ok)}.sw.warn{border-color:var(--warn)}.sw.bad{border-color:var(--bad)}.sw.none{border:1px dashed var(--dim)}
.cells{display:inline-flex;gap:2px;vertical-align:middle}
.cells i{width:9px;height:12px;border-radius:2px;background:var(--mutedbg)}
.cells i.ok{background:var(--ok)}.cells i.warn{background:var(--warn)}.cells i.bad{background:var(--bad)}.cells i.muted{background:var(--muted)}
pre.diff{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;max-height:50vh;overflow:auto}
@media (max-width:1200px){.maplayout{grid-template-columns:200px minmax(0,1fr)}.maplayout .mapdetail{grid-column:1/-1}}
@media (max-width:900px){.maplayout{grid-template-columns:minmax(0,1fr)}.pagelist{display:none}.pagepick{display:block}}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{display:none}.side.open{display:block}.filters-toggle{display:inline-block}.funnel .row{grid-template-columns:120px minmax(0,1fr) 44px}.dl{grid-template-columns:90px minmax(0,1fr)}}
</style>

      h('dt', {}, 'Duration'), h('dd', {}, sparkline(i.duration_ms) || '–'),
      h('dt', {}, 'Evidence'), h('dd', {}, artLink(i.evidence)),
      h('dt', {}, 'Collections'), h('dd', {}, colls(i).join(', ') || '–')),
    i.steps.length ? h('section', { class: 'sec' }, h('h3', {}, 'Steps'), h('ol', { class: 'steps' }, i.steps.map((st) => h('li', { 'data-k': { open: '↗', act: '▶', assert: '?', expect: '=', shot: '◉' }[st.kind] || '•', class: st.kind }, h('span', { class: 'meta' }, `${str(st.kind)} `), stepText(st.text))))) : null,

// -------------------------------------------------------------------- runs
const runName = (r) => (r.type === 'regression' ? `${RUNTYPE.regression} · ${r.build}` : `${RUNTYPE[r.type]} ${r.ref} · ${r.build}`);

}

function runDrawer(r) {

// --------------------------------------------------------------------- map
const KIND = { nav: 'Navigation item', headings: 'Heading', tabs: 'Tab', buttons: 'Button', inputs: 'Field', links: 'Link' };
const hsItems = (x) => x.items.filter(present).map((k) => byKey.get(k));

  const out = [];
  for (const p of pagesData) {
    const ks = p.hotspots.map((x, k) => (x.items.includes(i.key) ? k : -1)).filter((k) => k >= 0);
    if (ks.length) for (const k of ks.slice(0, 3)) out.push([p, k]); else if (p.items.includes(i.key)) out.push([p, null]);
  }

}
function itemRow(i) {

  const src = img(p.shot);
  const vp = arr(p.viewport).map(Number);
  const ratio = vp.length === 2 && vp[0] > 0 && vp[1] > 0 ? vp[0] / vp[1] : 1.6;
  const showAll = S.all || !src;
  const stage = h('div', { class: `stage${src ? '' : ' wf'}`, style: `aspect-ratio:${ratio}` }, src ? h('img', { src, alt: `Screenshot of ${str(p.title) || p.pattern}` }) : null);
  const order = p.hotspots.map((x, k) => k).sort((a, b) => p.hotspots[b].box[2] * p.hotspots[b].box[3] - p.hotspots[a].box[2] * p.hotspots[a].box[3]);

      'aria-label': `${what}: ${its.length} test(s)`, 'aria-pressed': S.hs === k ? 'true' : 'false', onclick: () => go({ hs: S.hs === k ? null : k }) },
    src ? null : h('span', {}, x.name)));
  }
  const pageItems = p.items.filter(present).map((k) => byKey.get(k)).sort((a, b) => SEV[a.cls] - SEV[b.cls]);
  const named = p.hotspots.filter((x) => hsItems(x).length).length;
  const head = h('div', {},
    h('div', { style: 'display:flex;flex-wrap:wrap;gap:8px;align-items:baseline' }, h('h2', { style: 'font-size:16px;margin:0' }, str(p.title) || p.pattern), h('code', {}, p.pattern),
      h('span', { class: `badge ${{ regression: 'ok', exploratory: 'warn' }[p.covered] || 'bad'}` }, p.covered === 'regression' ? 'regression' : p.covered === 'exploratory' ? 'exploratory only' : 'not covered')),
    h('div', { class: 'legend-row' },

      src && p.hotspots.length ? h('label', {}, h('input', { type: 'checkbox', checked: S.all ? true : null, onchange: () => { S.all = !S.all; render(); } }), ' ', h('i', { class: 'sw none' }), 'show controls no test names') : null));

      x.to ? h('p', { class: 'meta' }, `Leads to ${x.to}: the tests that reach that page.`, pageOf(x.to) ? [' ', h('button', { class: 'linkish', type: 'button', onclick: () => go({ pg: x.to, hs: null }) }, 'Open it on the map →')] : null) : null,
      its.length ? h('ul', { class: 'att' }, its.map(itemRow)) : h('p', { class: 'muted-t' }, x.to ? 'No test reaches that page.' : 'No test names this control.'),
      h('button', { class: 'linkish', type: 'button', onclick: () => go({ hs: null }) }, '← the whole page')]

}
