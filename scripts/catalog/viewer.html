  <div class="title"><h1 id="h-title">Test catalog</h1><span class="meta" id="h-meta"></span></div>
  <div class="backbar" id="h-back" hidden></div>

</div></header>
<main class="wrap" id="view" tabindex="-1"><noscript><p class="empty">The catalog is drawn by JavaScript: open it where scripts run (the published artifact, or a browser), not in a static preview.</p></noscript></main>
<script type="application/json" id="qi-catalog-data">__QI_CATALOG_DATA__</script>
<script>

const num = (r) => { const m = str(r).match(/\d+/); return m ? +m[0] : 0; };

const fmtDate = (u) => { const d = new Date(u); return isNaN(d) ? '' : d.toISOString().slice(0, 10); };
function rel(u) {

  if (m < 1) return 'just now'; if (m < 60) return `${m} min ago`; const hh = Math.round(m / 60);
  if (hh < 48) return `${hh} h ago`; return `${Math.round(hh / 24)} days ago`;

const ms = (n) => (n == null ? '' : n < 1000 ? `${n} ms` : `${(n / 1000).toFixed(1)} s`);
let storageOK = false;
try { localStorage.setItem('qi-catalog:probe', '1'); localStorage.removeItem('qi-catalog:probe'); storageOK = true; } catch { /* sandboxed */ }

// --------------------------------------------------------------------- data
let D = {};
try {
  const t = $('#qi-catalog-data').textContent.trim();
  if (t && !t.startsWith('__QI' + '_CATALOG')) D = JSON.parse(t) || {};
} catch { D = {}; }
if (typeof D !== 'object' || Array.isArray(D)) D = {};
const images = D.images && typeof D.images === 'object' ? D.images : {};
const img = (id) => { const v = id == null ? null : images[id]; return typeof v === 'string' && v.startsWith('data:image/') ? v : null; };

const VAL = {
  verified: ['Verified', 'ok'], passed: ['Passed', 'ok'], unchanged: ['Unchanged', 'ok'], relearned: ['UI changed · steps re-learned', 'ok'], 'observed-ok': ['Observed OK', 'ok'],
  healed: ['UI changed · check repaired', 'warn'], 'needs-review': ['Needs review', 'warn'], flaky: ['Flaky', 'warn'], inconclusive: ['Inconclusive', 'warn'], partial: ['Partial', 'warn'], observation: ['Observation', 'warn'],
  failed: ['Failed', 'bad'], regression: ['Regression', 'bad'],
  blocked: ['Blocked', 'muted'], environment: ['Environment failed — no results', 'muted'], superseded: ['Superseded by a change', 'muted'], 'not-testable': ['Not testable', 'muted'], drift: ['Drift — not run', 'muted'],
};
const vLabel = (v) => (own(VAL, v) ? VAL[v][0] : v ? str(v) : 'No verdict yet');
const vClass = (v) => (own(VAL, v) ? VAL[v][1] : 'none');
const SEV = { bad: 0, warn: 1, muted: 2, ok: 3, none: 4 };
const TIERS = ['regression', 'promotable', 'exploratory', 'quarantined', 'retired', 'untracked'];
const tierRank = (t) => { const i = TIERS.indexOf(t); return i < 0 ? 9 : i; };

const ALL = arr(D.items).filter((x) => x && typeof x === 'object' && x.key).map((x) => {
  const o = x.origin && typeof x.origin === 'object' ? x.origin : {};
  const hist = arr(x.history).filter((e) => e && typeof e === 'object');
  const it = {
    ...x, origin: o, full: hist, verdict0: x.verdict && typeof x.verdict === 'object' ? x.verdict : hist[hist.length - 1] || null, steps: arr(x.steps).filter((e) => e && typeof e === 'object'),
    healsAll: arr(x.heals), flakyAll: arr(x.flaky), pages: arr(x.pages).map(str), duration_ms: arr(x.duration_ms).filter(Number.isFinite),

  it.text = [it.label, x.name, x.given, x.when, x.then, x.summary, o.title, x.file, x.area, ...it.steps.map((e) => e.text)].map(str).join(' \n ').toLowerCase();

});
const byKey = new Map(ALL.map((i) => [i.key, i]));
const builds = arr(D.builds).filter((b) => b && b.id).map((b) => ({ id: str(b.id), utc: str(b.utc) }));

// "As of a build": every verdict, heal, flaky confirmation, flag and count as it stood when that

let items = ALL;
let presentSet = new Set();
let nightsAt = []; let runsAt = []; let buildsAt = builds; // the nights, runs and builds up to that build
let derivedAt;
function derive() {
  const at = S.at ? builds.find((b) => b.id === S.at) : null;
  if (S.at && !at) S.at = null;
  if (derivedAt === S.at) return;
  derivedAt = S.at;
  const upto = at ? at.utc : null;
  const then = (e) => !upto || (e && str(e.utc) <= upto);
  items = [];
  for (const it of ALL) {
    it.history = it.full.filter(then);
    it.heals = it.healsAll.filter(then);
    it.flaky = it.flakyAll.filter(then);
    it.verdict = upto ? it.history[it.history.length - 1] || null : it.verdict0;
    it.latest = it.verdict ? str(it.verdict.value) : '';
    it.cls = vClass(it.latest);

    if (it.drift) it.flags.push('drift');
    if (it.tier === 'quarantined') it.flags.push('quarantined');
    if (it.checks && it.checks.agent_asserts > 0) it.flags.push('agent.assert');
    if (img(it.still)) it.flags.push('has still');
    if (it.testable === false) it.flags.push('not testable');

}
const present = (k) => presentSet.has(k);

// Collections: "#42", "#42 AC-1", "S-7", "S-7 AC-1".
const collections = arr(D.collections).filter((c) => c && c.name).map((c) => ({ name: str(c.name), members: arr(c.members).map(str) }));
const memberOf = new Map();

  const [ref, id] = m.trim().split(/\s+/);
  for (const i of ALL) if (i.ref === ref && (!id || str(i.id) === id)) (memberOf.get(i.key) || memberOf.set(i.key, []).get(i.key)).push(c.name);
}
const colls = (i) => [...new Set(memberOf.get(i.key) || [])];

// Pins (this browser only).
const PIN_KEY = `qi-catalog:${str(D.target)}:pins`;
let pins = new Set();

const savePins = () => { try { localStorage.setItem(PIN_KEY, JSON.stringify([...pins])); } catch { /* ignore */ } };

const nights = arr(D.nights).filter((n) => n && n.build).sort((a, b) => str(a.utc).localeCompare(str(b.utc)));
const pagesData = arr(D.pages).filter((p) => p && p.pattern).map((p) => ({ ...p, pattern: str(p.pattern), items: arr(p.items).map(str),
  hotspots: arr(p.hotspots).filter((x) => x && arr(x.box).length === 4 && arr(x.box).every((n) => Number.isFinite(+n))).map((x) => ({ ...x, name: str(x.name), kind: str(x.kind), box: x.box.map(Number), items: arr(x.items).map(str) })) }));
const pageOf = (pat) => pagesData.find((p) => p.pattern === pat);

// Runs: every night, issue run and scenario run — the way into each one's report.
const RUNTYPE = { regression: 'Nightly regression', issue: 'Issue run', scenario: 'Scenario run' };

  id: [r.type, r.ref, r.build, r.utc].map(str).join('~') }));

// A path a test opens (`/projects/{id}`) on the newest UI map's page pattern (`/projects/:id`).

// ------------------------------------------------------------------ facets

  { id: 'origin', label: 'Origin', get: (i) => [i.origin.kind || 'issue'] },
  { id: 'ref', label: 'Issue / scenario', get: (i) => [i.ref], order: (a, b) => str(a).localeCompare(str(b), 'en', { numeric: true }), fmt: (v) => `${v}${originTitle(v) ? ` ${originTitle(v).slice(0, 40)}` : ''}` },
  { id: 'kind', label: 'Kind', get: (i) => [i.kind] },

  tier: ['Tier', null, (a, b) => tierRank(a.tier) - tierRank(b.tier)],
  verdict: ['Latest verdict', null, (a, b) => SEV[a.cls] - SEV[b.cls] || a.latest.localeCompare(b.latest)],
  area: ['Area', (i) => str(i.area), (a, b) => str(a.area).localeCompare(str(b.area)), (i) => (i.area ? facetLink('area', i.area) : '')],
  surface: ['Surface', (i) => str(i.surface), (a, b) => str(a.surface).localeCompare(str(b.surface)), (i) => (i.surface ? facetLink('surface', i.surface) : '')],

  last: ['Last run', (i) => (i.verdict ? fmtDate(i.verdict.utc) : ''), (a, b) => str(a.verdict && a.verdict.utc).localeCompare(str(b.verdict && b.verdict.utc))],
  build: ['Build', (i) => str(i.verdict && i.verdict.build), (a, b) => str(a.verdict && a.verdict.build).localeCompare(str(b.verdict && b.verdict.build)), (i) => (i.verdict && i.verdict.build ? buildLink(i.verdict.build) : '')],

const GROUPS = { none: 'No grouping', origin: 'Origin', tier: 'Tier', area: 'Area', page: 'Page', verdict: 'Latest verdict', collection: 'Collection', label: 'Issue label' };
const QUICK = [

  if (p.get('s')) S.sort = p.get('s').split(',').map((x) => [x.replace(/^-/, ''), x.startsWith('-') ? -1 : 1]).filter(([k]) => own(COLS, k));

  if (st.l !== 'table') p.set('l', st.l);

  if (st.i) p.set('i', st.i);
  if (st.r) p.set('r', st.r);
  if (st.o) p.set('o', st.o);

  if (st.pg) p.set('pg', st.pg);

// ------------------------------------------------------------------ history
// Every move to another place — a view, a panel, a page of the map, a build — is a step the
// browser's back button and the page's own "Back" undo. The steps walked are kept with each
// history entry; where the page may not touch the browser history (a sandboxed frame), in memory.

let histOK = true;

  return `${view}${pg ? ` · ${str(pg.title) || pg.pattern}` : ''}${st.v === 'runs' && st.rb ? ` · build ${st.rb}` : ''}${filt && ['catalog', 'gallery', 'history'].includes(st.v) ? ' (filtered)' : ''}${st.at ? ` · as of ${st.at}` : ''}`;
}
const DRAWER = ['i', 'r', 'o'];
// Go to another place: `patch` changes the state; without a panel key, the panel closes.
function nav(patch) {

    focus = [h('datalist', { id: 'qi-areas' }, areas.map((a) => h('option', { value: a }))),
      h('div', { class: 'set' }, h('dt', {}, 'Area'), h('dd', {}, pick, h('button', { class: 'btn', type: 'button', onclick: () => {
        if (CMD_RE.test(`focus ${pick.value.trim()}`)) { want(id, `focus ${pick.value.trim()}`); return; }
        pick.setCustomValidity('Letters, digits, spaces and _ . / - only, up to 40'); pick.reportValidity();

}
function viewModules() {

// ---------------------------------------------------------------- findings
const F = D.findings && typeof D.findings === 'object' ? D.findings : {};
const SEVC = { critical: 'bad', high: 'bad', major: 'bad', medium: 'warn', minor: 'warn', low: 'muted', info: 'muted' };
const sevB = (sv) => h('span', { class: `badge ${SEVC[str(sv)] || 'none'}` }, str(sv) || '–');
const design = arr(D.design).filter((d) => d && /^D-\d+$/.test(str(d.id)));
function viewFindings() {

  const open = design.filter((d) => d.status === 'open');

    h('b', { class: cls || null }, String(val2)), h('span', {}, label));
  const secN = sec && sec.counts ? (+sec.counts.critical || 0) + (+sec.counts.high || 0) : null;

    kpi('Stress: failed checks', st ? sf.filter((c) => c.status === 'fail').length : '–'),
    kpi('Security: critical + high', secN == null ? '–' : secN),
    kpi('Edge-case observations', obs.length, null, obs.length ? () => go({ v: 'catalog', f: { kind: ['exploration'], verdict: ['observation'] }, q: '' }) : null)));
  const tableOf = (cols, rows) => h('div', { class: 'tablewrap' }, h('table', { class: 'list' }, h('thead', {}, h('tr', {}, cols.map((c) => h('th', { style: 'cursor:default' }, c)))),
    h('tbody', {}, rows.map((r) => h('tr', { style: 'cursor:default' }, r.map((c) => h('td', {}, c)))))));
  const sec2 = (title, sub, body) => h('section', { class: 'panel', style: 'margin-top:14px' }, h('h2', {}, title), sub ? h('p', { class: 'meta' }, sub) : null, body);
  v.append(sec2('Form validation', val ? ['Build ', buildLink(val.build), ` · run ${str(val.run)} · ${fmtDate(val.utc)} · ${arr(val.cases).length} cases`] : null,
    !val ? h('p', { class: 'muted-t' }, 'The validation module has not run yet.') : vf.length ? tableOf(['Case', 'Page', 'Form · field', 'Input', 'Result', 'Severity', 'What broke'],
      vf.sort((a, b) => (a.result === 'finding' ? 0 : 1) - (b.result === 'finding' ? 0 : 1) || (SEVC[a.severity] === 'bad' ? 0 : 1) - (SEVC[b.severity] === 'bad' ? 0 : 1))
        .map((c) => [h('code', {}, str(c.id)), pageLink(str(c.page)), `${str(c.form)}${c.field ? ` · ${str(c.field)}` : ''}`, str(c.kind),
          h('span', { class: `badge ${c.result === 'finding' ? 'bad' : c.result === 'flaky' ? 'warn' : 'muted'}` }, str(c.result)), c.severity ? sevB(c.severity) : '', str(c.message)])) : h('p', { class: 'muted-t' }, 'Every case passed.')));
  v.append(sec2('Stress', st ? ['Build ', buildLink(st.build), ` · ${fmtDate(st.utc)}${st.config ? ` · ${str(st.config.concurrency)} workers × ${str(st.config.duration_s)} s` : ''}`] : null,
    !st ? h('p', { class: 'muted-t' }, 'The stress module has not run yet.') : sf.length ? tableOf(['Check', 'Target', 'Status', 'Severity', 'Evidence'],
      sf.map((c) => [h('code', {}, str(c.id)), h('code', {}, str(c.target)), h('span', { class: `badge ${c.status === 'fail' ? 'bad' : 'muted'}` }, str(c.status)), sevB(c.severity),
        str(c.evidence || c.reason)])) : h('p', { class: 'muted-t' }, 'Every check passed.')));
  const rq = arr(F.requests).filter((x) => x && /^S-\d+$/.test(str(x.id)));

        str(x.title) || h('span', { class: 'muted-t' }, 'criteria not frozen yet'), x.utc ? rel(x.utc) : '']))));

    : fo.map((x) => h('div', { style: 'margin-top:8px' }, h('h3', {}, x.area && items.some((i) => str(i.area) === str(x.area)) ? facetLink('area', str(x.area)) : str(x.area) || str(x.run), x.build ? [' · ', buildLink(x.build)] : '', x.utc ? ` · ${fmtDate(x.utc)}` : ''),

  v.append(sec2('Security', sec ? ['Build ', buildLink(sec.candidate), ` · ${fmtDate(sec.utc)} — the findings stay in the private report`] : null,

      h('span', { style: 'margin-right:10px' }, sevB(k), ` ${+((sec.counts || {})[k]) || 0}`))), h('p', {}, sec.report ? artLink(sec.report) : h('span', { class: 'muted-t' }, 'No report reference recorded for this run.')))));
}

// ------------------------------------------------------------------ design
const dCheck = (d) => str(d.check).replace(/^review:.*/, 'review').replace(/^a11y:.*/, 'a11y');
function designMarkdown(list) {
  return list.map((d) => `- **${str(d.id)}** (${str(d.severity)}${d.suspect ? ', suspect' : ''}) \`${str(d.pattern)}\`${d.viewport && d.viewport !== '-' ? ` @ ${str(d.viewport)}` : ''} — ${str(d.saw)}`
    + ` _(${str(d.check)}; since ${str(d.first_seen)}${d.status !== 'open' ? `; ${str(d.status)}` : ''})_`).join('\n');
}
function viewDesign() {
  const v = $('#view');
  if (!design.length) { v.append(h('div', { class: 'empty' }, h('p', {}, 'No design findings yet.'), h('p', {}, 'Switch the UI sweep on in Modules; tests\' "noticed in passing" items appear here too.'))); return; }
  const uniq = (f) => [...new Set(design.map(f).filter(Boolean))].sort();
  const pass = (d) => (!DS.st || d.status === DS.st) && (!DS.sev || d.severity === DS.sev) && (!DS.vp || str(d.viewport) === DS.vp) && (!DS.ck || dCheck(d) === DS.ck)
    && (!DS.pg || str(d.pattern) === DS.pg) && (!DS.q || [d.id, d.saw, d.target, d.pattern, d.check].map(str).join(' ').toLowerCase().includes(DS.q.toLowerCase()));
  const list = design.filter(pass).sort((a, b) => (a.severity === 'major' ? 0 : 1) - (b.severity === 'major' ? 0 : 1) || str(a.pattern).localeCompare(str(b.pattern)) || num(a.id) - num(b.id));

  v.append(h('div', { class: 'grid-kpi' }, [['Open', open.length], ['Open · major', open.filter((d) => d.severity === 'major').length],
    ['New in the newest build', open.filter((d) => str(d.first_seen) === newest).length], ['Suspect (model unsure)', open.filter((d) => d.suspect).length],
    ['Resolved', design.filter((d) => d.status === 'resolved').length], ['Dismissed', design.filter((d) => d.status === 'dismissed').length]]
    .map(([l, n]) => h('div', { class: 'kpi' }, h('b', {}, String(n)), h('span', {}, l)))));
  const sel = (label, key, opts, fmt) => h('select', { 'aria-label': label, onchange: (e) => { DS[key] = e.target.value; writeHash(); render(); } },
    h('option', { value: '' }, `${label}: all`), opts.map((o) => h('option', { value: o, selected: DS[key] === o ? true : null }, fmt ? fmt(o) : o)));
  const copyMd = h('button', { class: 'btn', type: 'button', onclick: async () => {
    const md = designMarkdown(list);
    try { await navigator.clipboard.writeText(md); copyMd.textContent = `Copied ${list.length}`; setTimeout(() => { copyMd.textContent = 'Copy as Markdown'; }, 1500); return; } catch { /* no clipboard */ }
    const ta = h('textarea', { readonly: true, rows: 8, style: 'width:100%', 'aria-label': 'Findings as Markdown' }); ta.value = md; copyMd.replaceWith(ta); ta.select();
  } }, 'Copy as Markdown');
  const q = h('input', { type: 'search', placeholder: 'Search findings', value: DS.q, 'aria-label': 'Search findings', oninput: debounce((e) => { DS.q = e.target.value; writeHash(); render(true); }, 200) });
  v.append(h('div', { class: 'toolbar', style: 'margin-top:14px' }, q, sel('Status', 'st', ['open', 'resolved', 'dismissed']), sel('Severity', 'sev', ['major', 'minor']),
    sel('Screen', 'vp', uniq((d) => str(d.viewport))), sel('Check', 'ck', uniq(dCheck)), sel('Page', 'pg', uniq((d) => str(d.pattern))),
    h('span', { class: 'count' }, `${list.length} of ${design.length}`), copyMd));
  if (!list.length) { v.append(h('p', { class: 'empty' }, 'No finding matches.')); return; }
  v.append(h('div', { class: 'gal' }, list.slice(0, S.limit).map((d) => {
    const src = img(d.crop);
    return h('article', { class: 'dcard', 'aria-label': str(d.id) },
      src ? h('img', { src, alt: `${str(d.id)}: ${str(d.saw)}`, loading: 'lazy' }) : h('div', { class: 'ph' }, 'no screenshot'),
      h('div', { style: 'display:flex;flex-wrap:wrap;gap:4px;align-items:center' }, h('b', {}, str(d.id)), sevB(d.severity),
        h('span', { class: `badge ${d.status === 'open' ? 'warn' : d.status === 'resolved' ? 'ok' : 'muted'}` }, str(d.status)), d.suspect ? h('span', { class: 'badge muted', title: 'The model was unsure — check before acting' }, 'suspect') : null),
      h('div', { class: 'saw' }, str(d.saw)),
      h('div', { class: 'meta' }, pageLink(str(d.pattern)), d.viewport && d.viewport !== '-' ? ` @ ${str(d.viewport)}` : '', ` · ${str(d.check)}`),
      h('details', {}, h('summary', {}, 'Details'), h('dl', { class: 'dl' },
        h('dt', {}, 'Element'), h('dd', {}, str(d.target) || '–'), h('dt', {}, 'Source'), h('dd', {}, { sweep: 'UI sweep check', review: 'model review of the screenshot', noticed: 'noticed while testing' }[d.source] || str(d.source)),
        h('dt', {}, 'First seen'), h('dd', {}, d.first_seen ? buildLink(d.first_seen) : '–'), h('dt', {}, 'Last seen'), h('dd', {}, d.last_seen ? buildLink(d.last_seen) : '–'),
        d.resolved_build ? [h('dt', {}, 'Resolved in'), h('dd', {}, buildLink(d.resolved_build))] : null),
        d.status === 'open' ? h('div', {}, h('span', { class: 'meta' }, 'Not a defect? '), copyBox(`dismiss ${str(d.id)}`)) : null));
  })));
  if (list.length > S.limit) v.append(h('div', { class: 'more-row' }, h('button', { class: 'btn', type: 'button', onclick: () => { S.limit += 100; render(); } }, `Show more (${list.length - S.limit})`)));
}

// ------------------------------------------------------------------ render
function render(keepSearchFocus) {
  const pos = keepSearchFocus && document.activeElement && document.activeElement.type === 'search' ? document.activeElement.selectionStart : null;
  derive();
  renderHeader();
  const v = $('#view'); v.textContent = '';
  if (S.at) {
    const b = builds.find((x) => x.id === S.at);
    v.append(h('div', { class: 'asof', role: 'status' }, h('b', {}, `As of build ${S.at}`), ` (${fmtDate(b && b.utc)}): verdicts and counts as they stood then; files, tiers and steps are today's.`,
      nightOf(S.at) ? h('button', { class: 'btn', type: 'button', onclick: () => openRun(nightOf(S.at)) }, 'That night') : null,
      h('button', { class: 'btn', type: 'button', onclick: () => go({ at: null }) }, 'Back to now')));
  }
  ({ overview: viewOverview, modules: viewModules, findings: viewFindings, design: viewDesign, runs: viewRuns, map: viewMap, catalog: () => viewList(false), gallery: () => viewList(true), coverage: viewCoverage, history: viewHistory, lifecycle: viewLifecycle }[S.v] || viewOverview)();
  if (pos != null) { const q = $('input[type=search]'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch { /* ignore */ } } }
}
// The steps kept with a history entry: a reload or a "forward" finds its own way back.
const trailOf = (st) => arr(st && st.qi).filter((x) => x && typeof x.h === 'string' && typeof x.label === 'string').slice(-100);
readHash();
try { trail = trailOf(history.state); } catch { trail = []; }
setLocation(false);
render();
renderDrawer();
// The platform may inject its bridge after this script ran: draw the send buttons then.
if (!bridge()) window.addEventListener('load', () => { if (bridge()) { render(); renderDrawer(); } });
// Back or forward: the entry's own steps. An address typed by hand: a step from where the page was.
function arrived(state) {
  const mine = state && Array.isArray(state.qi);
  if (mine) trail = trailOf(state); else trail = [...trail, { h: hashOf(), label: where() }].slice(-100);
  readHash();
  if (!mine) setLocation(false);
  render(); renderDrawer();
}
let popped = null;
window.addEventListener('popstate', (e) => { popped = location.hash; arrived(e.state); });
window.addEventListener('hashchange', () => { if (location.hash === popped) { popped = null; return; } let st = null; try { st = history.state; } catch { /* sandboxed */ } arrived(st); });
})();
</script>
