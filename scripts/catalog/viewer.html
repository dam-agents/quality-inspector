<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test catalog</title>
<link rel="icon" href="data:,">
<meta name="referrer" content="no-referrer">
<!-- The test catalog viewer (docs/catalog.md). scripts/catalog.mjs replaces the data token below
     with the catalog JSON. Read-only; every data string is untrusted and only ever set as text. -->
<style>
/* Colours: the page, its surfaces, the verdicts, and one colour per kind of control —
   go (a place on this page), ext (a new tab), agent (a command for the agent). */
:root{--bg:#f5f4fa;--surface:#fff;--fg:#1c1b29;--dim:#666577;--card:#f2f1f8;--line:#e3e1ee;
--ok:#137a42;--okbg:#e0f5e8;--bad:#bf2630;--badbg:#fde7e7;--warn:#8f5c00;--warnbg:#fff0c7;--muted:#585a69;--mutedbg:#ebeaf2;
--link:#2d58d0;--gobg:#e7edfd;--ext:#0a7570;--extbg:#ddf3f1;--agent:#7438ec;--agentbg:#f1e8ff;--sel:#e7edfd;
--grad:linear-gradient(120deg,#7438ec 0%,#2d58d0 55%,#0a9a8e 100%);
--shadow:0 1px 2px rgba(30,20,80,.05),0 6px 20px rgba(30,20,80,.07);--shadow2:0 2px 4px rgba(30,20,80,.08),0 14px 34px rgba(30,20,80,.14);--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121220;--surface:#1a1a2a;--fg:#ececf5;--dim:#a3a2b9;--card:#222238;--line:#2f2f48;
--ok:#6fdc9a;--okbg:#15301f;--bad:#ff8f8f;--badbg:#3a1a1d;--warn:#f6c76b;--warnbg:#3a2d10;--muted:#b6b6c8;--mutedbg:#2a2a3e;
--link:#8eaaff;--gobg:#1f2850;--ext:#4fd1c5;--extbg:#0f2e2c;--agent:#b794ff;--agentbg:#2a1f45;--sel:#1f2850;
--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);--shadow2:0 2px 4px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme=dark]{--bg:#121220;--surface:#1a1a2a;--fg:#ececf5;--dim:#a3a2b9;--card:#222238;--line:#2f2f48;
--ok:#6fdc9a;--okbg:#15301f;--bad:#ff8f8f;--badbg:#3a1a1d;--warn:#f6c76b;--warnbg:#3a2d10;--muted:#b6b6c8;--mutedbg:#2a2a3e;
--link:#8eaaff;--gobg:#1f2850;--ext:#4fd1c5;--extbg:#0f2e2c;--agent:#b794ff;--agentbg:#2a1f45;--sel:#1f2850;
--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);--shadow2:0 2px 4px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px}
.meta{color:var(--dim);font-size:12.5px}
.muted-t{color:var(--dim)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.ico{width:14px;height:14px;flex:none;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Header: the name, the tabs grouped by subject, and the place you are on. */
header.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top::before{content:"";display:block;height:4px;background:var(--grad)}
.title{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding-top:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow);flex:none}
.title h1{font-size:18px;margin:0;letter-spacing:-.01em}
.title .sp{flex:1}
.title select{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:4px 10px;max-width:240px}
.tabs{display:flex;flex-wrap:wrap;gap:6px 4px;margin-top:8px;padding-bottom:8px;align-items:center}
.tabs .grp{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:3px;border-radius:18px;background:var(--card);max-width:100%}
.tabs .gl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:0 6px 0 8px;white-space:nowrap}
.tabs button{background:none;border:0;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--dim);white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:background .15s,color .15s}
.tabs button:hover{color:var(--fg);background:var(--surface)}
.tabs button[aria-selected=true]{color:var(--fg);background:var(--surface);font-weight:600;box-shadow:var(--shadow)}
.tabs .em{font-size:15px;line-height:1}
@media (max-width:1440px){.tabs .gl{display:none}.tabs button{padding:5px 9px}}
.loc{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 16px;font-size:13px;color:var(--dim)}
.loc .here{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc .btn{font-size:12.5px;padding:3px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:6px 0 56px}

/* The view's own head: its icon, its name, one line of what it is for. */
.vhead{display:flex;gap:12px;align-items:center;margin:4px 0 16px}
.vico{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);flex:none}
.vhead h2{font-size:20px;margin:0;letter-spacing:-.01em}
.vhead p{margin:2px 0 0;color:var(--dim);font-size:13px;max-width:900px}
.vhead .btn{margin-left:auto;flex:none;font-size:12px;padding:2px 10px}

/* Buttons, chips, badges. */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:border-color .15s,transform .1s,box-shadow .15s;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--dim)}
.btn:active{transform:translateY(1px)}
.btn.on{background:var(--sel);border-color:var(--link);color:var(--link)}
.btn.primary{background:var(--link);border-color:var(--link);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:12.5px;white-space:nowrap;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--dim)}
.chip.on{background:var(--sel);border-color:var(--link);color:var(--link);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.7}
.badge.ok::before{content:"✓"}.badge.warn::before{content:"!"}.badge.bad::before{content:"✕"}.badge.muted::before{content:"–"}.badge.none::before{content:"○"}
.ok{color:var(--ok);background:var(--okbg)}.warn{color:var(--warn);background:var(--warnbg)}.bad{color:var(--bad);background:var(--badbg)}.muted{color:var(--muted);background:var(--mutedbg)}.none{color:var(--dim);background:transparent;border:1px dashed var(--line)}
.badge.cause::before{content:none}.cause{border:1px solid currentColor;background:var(--surface)}
.causes{margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.c-product{color:var(--bad)}.c-test{color:var(--warn)}.c-environment{color:var(--link)}.c-unknown{color:var(--dim)}
#zoom{position:fixed;inset:0;z-index:80;background:rgba(10,10,20,.88);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px 16px}
#zoom img{max-width:100%;height:auto;background:#fff;border-radius:6px;cursor:zoom-in;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#zoom.real img{max-width:none;cursor:zoom-out}
#zoom .close{position:fixed;top:10px;right:16px}
.zoomable{cursor:zoom-in}
.tier{display:inline-flex;gap:3px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;white-space:nowrap;line-height:1.6;background:var(--surface)}
.tier.regression{border-color:var(--link);color:var(--link)}
.tier.regression::before{content:"🌙"}.tier.promotable::before{content:"⭐"}.tier.exploratory::before{content:"🆕"}.tier.quarantined::before{content:"🚧"}.tier.retired::before{content:"💤"}.tier.untracked::before{content:"❔"}
.token{background:var(--sel);border-radius:3px;padding:0 3px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.chip-s{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sel);color:var(--link)}

/* The kinds of control. go: a place on this page (→ a view, ▸ a panel, ⌖ the map); ext: a new tab;
   agent: a command for the agent; local: this page only. Each says where it goes in its tooltip. */
.lnk,.linkish{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font:inherit;text-align:left;display:inline-flex;gap:3px;align-items:center;text-decoration:none;border-radius:4px}
.lnk:hover,.linkish:hover{text-decoration:underline;text-underline-offset:3px}
.lnk .ico,.linkish .ico{width:12px;height:12px;opacity:.75}
code.lnk,.lnk code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
a.k-ext,.k-ext.lnk{color:var(--ext)}
.btn.k-ext{border-color:color-mix(in srgb,var(--ext) 45%,var(--line));color:var(--ext);background:var(--extbg)}
.btn.k-ext:hover{border-color:var(--ext)}
.btn.k-go{color:var(--link)}
.btn.k-go:hover{border-color:var(--link)}
.private{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--dim);border:1px dashed var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap;cursor:help}
.rowgo{background:none;border:0;padding:4px;border-radius:6px;color:var(--dim);cursor:pointer;display:inline-flex}
tr:hover .rowgo,.rowgo:hover{color:var(--link);background:var(--gobg)}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.key{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 11px;font-size:12.5px;border:1px solid var(--line);background:var(--surface)}
.key.k-go{color:var(--link);border-color:color-mix(in srgb,var(--link) 40%,var(--line))}
.key.k-ext{color:var(--ext);border-color:color-mix(in srgb,var(--ext) 40%,var(--line))}
.key.k-agent{color:var(--agent);border-color:color-mix(in srgb,var(--agent) 45%,var(--line));background:var(--agentbg)}
.key.k-local{color:var(--dim)}

/* A message for the agent: a violet control opens the box at the bottom (#outbox), which shows the
   message and sends it only on "Send to the agent"; the page changes nothing by itself. */
.cmd-tag{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--agent);border-radius:999px;padding:1px 8px 1px 6px;cursor:help}
#outbox{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:25;width:min(720px,calc(100% - 24px));background:var(--surface);border:2px solid var(--agent);border-radius:16px;box-shadow:var(--shadow2);padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto;animation:qi-up .2s ease-out}
#outbox .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#outbox pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:600 13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--agent);background:var(--agentbg);border:1px dashed color-mix(in srgb,var(--agent) 55%,transparent);border-radius:10px;padding:8px 10px;max-height:30vh;overflow:auto}
#outbox p{margin:0;color:var(--dim);font-size:12.5px}
#outbox.ext{border-color:var(--ext)}
#outbox.ext pre{color:var(--ext);background:var(--extbg);border-color:color-mix(in srgb,var(--ext) 55%,transparent)}
#outbox input{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
body.has-outbox #tray{display:none}
.btn.agent{background:var(--agent);border-color:var(--agent);color:#fff;font-weight:600}
.btn.agent:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--agent) 25%,transparent)}
.btn.agent-o{border-color:color-mix(in srgb,var(--agent) 50%,var(--line));color:var(--agent);background:var(--surface)}
.btn.agent-o:hover{border-color:var(--agent)}
.btn.prep,.chip.prep{border-style:dashed;border-color:color-mix(in srgb,var(--agent) 50%,var(--line))}
.btn.prep:hover,.chip.prep:hover{border-color:var(--agent);color:var(--agent)}
.btn.prep .ico{color:var(--agent)}

/* The tooltip: one for the page, under (or over) its control. */
#qi-tip{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 16px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow2);padding:7px 10px;font-size:12.5px;line-height:1.45;pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity .12s,transform .12s}
#qi-tip.show{opacity:1;transform:none}
#qi-tip .tk{display:flex;gap:6px;align-items:center;font-weight:600;margin-bottom:2px;overflow-wrap:anywhere}
#qi-tip .tk:last-child{margin-bottom:0}
#qi-tip .k-go,#qi-tip .k-panel{color:var(--link)}#qi-tip .k-ext{color:var(--ext)}#qi-tip .k-agent{color:var(--agent)}#qi-tip .k-local{color:var(--dim)}
.tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--dim);color:var(--dim);font-size:10px;font-weight:700;font-style:normal;cursor:help;margin-left:5px;vertical-align:middle;background:none;padding:0;line-height:1;flex:none}
.tip:hover,.tip.open{border-color:var(--link);color:var(--link)}
:is(span,b,dt)[data-tip]:not(.badge):not(.tier):not(.private):not(.cmd-tag):not(.sw-dot):not(.minibar):not(.cells):not(.key):not(.here):not(.bar):not(.chip-s):not(.dkind){text-decoration:underline dotted color-mix(in srgb,var(--dim) 60%,transparent);text-underline-offset:3px;cursor:help}

/* Panels and KPIs. */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;box-shadow:var(--shadow)}
.panel h2,.panel h3{font-size:14.5px;margin:0 0 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);overflow:hidden;color:var(--fg);font:inherit;text-align:left}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--line)}
.kpi.t-ok::before{background:var(--ok)}.kpi.t-warn::before{background:var(--warn)}.kpi.t-bad::before{background:var(--bad)}.kpi.t-go::before{background:var(--link)}.kpi.t-agent::before{background:var(--agent)}
.kpi .ke{font-size:18px;line-height:1;margin-bottom:4px;display:block}
.kpi b{display:block;font-size:24px;line-height:1.15;letter-spacing:-.02em}
.kpi span.kl{color:var(--dim);font-size:12.5px}
button.kpi{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
button.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--link)}
.kpi .kgo{position:absolute;right:10px;top:10px;color:var(--link);opacity:.55}
button.kpi:hover .kgo{opacity:1}
.activity{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (max-width:900px){.activity{grid-template-columns:1fr}}
.now{border-left:5px solid var(--link)}
.now-head{display:flex;align-items:center;gap:10px}.now-head h2{margin:0}
.now-body{display:flex;gap:14px;align-items:center;margin-top:10px}
.now-title{font-size:15px;margin:2px 0 6px;overflow-wrap:anywhere}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--ok);animation:qi-pulse 1.8s infinite;flex:none}
.pulse.idle{background:var(--muted);animation:none}
@keyframes qi-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ringwrap{position:relative;width:76px;height:76px;flex:none}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.ringtxt b{font-size:12px}.ringtxt span{font-size:10px;color:var(--dim)}
.ring .track{stroke:var(--mutedbg)}.ring{background:none}.ring.r-ok .arc{stroke:var(--ok)}.ring.r-warn .arc{stroke:var(--warn)}.ring.r-bad .arc{stroke:var(--bad)}
.qbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 4px}
.qbar i,.qdot{background:var(--muted)}.q-new{background:var(--link)!important}.q-re{background:var(--warn)!important}.q-sc{background:var(--agent)!important}.q-rp{background:var(--ok)!important}.q-ps{background:var(--ext)!important}
.qdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.qh{font-size:13px;margin:10px 0 2px}
.sched{list-style:none;margin:6px 0;padding:0}.sched li{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.sched li.off{opacity:.55}.sname{flex:1}
.sw-dot{width:9px;height:9px;border-radius:50%;background:var(--mutedbg);border:1px solid var(--muted);flex:none;align-self:center}.sw-dot.on{background:var(--ok);border-color:var(--ok)}
svg.tl .grid{stroke:var(--line)}svg.tl .laneline{stroke:var(--line);stroke-dasharray:2 3}
svg.tl .lane{font-size:12px;fill:var(--dim)}svg.tl .ax{font-size:10.5px;fill:var(--dim)}
svg.tl .dot-r{stroke:var(--surface);stroke-width:2;cursor:pointer;fill:var(--muted);transition:r .15s}svg.tl .dot-r:hover,svg.tl .dot-r:focus{stroke:var(--link);stroke-width:3;outline:none}
svg.tl .ok{fill:var(--ok)}svg.tl .warn{fill:var(--warn)}svg.tl .bad{fill:var(--bad)}svg.tl .muted,svg.tl .none{fill:var(--muted)}
svg text{fill:var(--dim);font-size:10px}
.att li{margin:6px 0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.att{padding:0;margin:0}
.names{list-style:none;padding:0;margin:6px 0 12px}.names li{margin:4px 0}
.celebrate{display:flex;gap:10px;align-items:center;color:var(--ok);font-weight:600}
.celebrate .em{font-size:24px}

/* Back, the panel's top bar, breadcrumbs. */
.dtop{position:sticky;top:-14px;margin:-14px -18px 10px;padding:10px 18px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:2}
.dtop .sp{flex:1}
.dtop .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dkind{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--link);background:var(--gobg);border-radius:999px;padding:2px 10px}
.crumbs{font-size:12.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs .sep{opacity:.6}
.rep{white-space:nowrap}
.btn.rep{padding:1px 10px;font-size:12px}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}

/* Catalog: filters at the side, a toolbar, a table or cards. */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;box-shadow:var(--shadow);align-self:start}
.side details{border-bottom:1px solid var(--line);padding:6px 0}
.side details:last-child{border-bottom:0}
.side summary{cursor:pointer;font-weight:600;font-size:13px}
.side label{display:flex;gap:6px;align-items:center;font-size:13px;padding:2px 0;cursor:pointer}
.side label .n{margin-left:auto;color:var(--dim);font-size:12px}
.side label.zero{opacity:.45}
.side .more{font-size:12px}
.filters-toggle{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.toolbar select{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.count{color:var(--dim);font-size:12.5px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table.list{border-collapse:collapse;width:100%;font-size:13px}
table.list th,table.list td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list tbody tr:last-child td{border-bottom:0}
table.list th{position:sticky;top:0;background:var(--card);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;font-size:12.5px;color:var(--dim)}
table.list th .arr{color:var(--link);font-size:11px}
table.list tbody tr{cursor:pointer;transition:background .1s}
table.list tbody tr:hover{background:var(--sel)}
.name{min-width:220px;max-width:420px}
td.nw{white-space:nowrap}
.group{margin-bottom:14px}
.group>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;font-weight:600}
.minibar{display:inline-flex;width:120px;height:8px;border-radius:4px;overflow:hidden;background:var(--mutedbg);vertical-align:middle}
.minibar i{display:block;height:100%}
.minibar .ok,.bar .ok{background:var(--ok)}.minibar .warn,.bar .warn{background:var(--warn)}.minibar .bad,.bar .bad{background:var(--bad)}.minibar .muted,.bar .muted{background:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--link)}
.card .then{color:var(--dim);font-size:12.5px}
.card .open-hint{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--link);opacity:0;transition:opacity .15s;display:inline-flex;gap:3px;align-items:center}
.card:hover .open-hint,.card:focus-visible .open-hint{opacity:1}
.agent{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--link);border-radius:var(--r);background:var(--card)}
.agent h3{margin:0 0 6px}.agent .sum{margin:0 0 8px;font-size:14px;line-height:1.5}.agent .own{font-size:12px;color:var(--dim);margin:6px 0 0}
.problem{margin:8px 0 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.problem h4{margin:0 0 6px;font-size:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.problem dl{margin:6px 0 0}
.saywhy{flex-basis:100%;margin:2px 0 0;font-size:13px;color:var(--dim)}
.about{margin:6px 0;padding:6px 10px;border-left:3px solid var(--link);background:var(--card);border-radius:4px}
.card img,.gal img{width:100%;display:block;border-radius:8px;border:1px solid var(--line);background:#fff}
.ph{aspect-ratio:16/10;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;background:var(--card)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gal .card img{aspect-ratio:16/10;object-fit:cover;object-position:top}
.more-row{text-align:center;margin:12px 0}
.star{background:none;border:0;cursor:pointer;font-size:16px;line-height:1;color:var(--dim);padding:0 2px}
.star.on{color:#e3a008}
.empty{padding:48px 0;text-align:center;color:var(--dim)}
.empty .em{font-size:44px;display:block;margin-bottom:6px}

/* Coverage, history, lifecycle. */
.navgroup{margin-bottom:20px}
.navgroup h3{display:flex;gap:10px;align-items:center;font-size:14px;margin:0 0 8px}
.bar{display:inline-flex;height:8px;width:180px;border-radius:4px;overflow:hidden;background:var(--mutedbg)}
.bar i{display:block;height:100%}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.page{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--muted);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.page:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.page.cov-regression{border-top-color:var(--ok)}.page.cov-exploratory{border-top-color:var(--warn)}.page.cov-none{border-top-color:var(--bad)}
.page img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line);background:#fff}
.heat{overflow:auto;border:1px solid var(--line);border-radius:var(--r);max-height:75vh;background:var(--surface)}
.heat table{border-collapse:separate;border-spacing:2px;font-size:12px}
.heat th{position:sticky;top:0;background:var(--surface);font-weight:500;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg);height:90px;white-space:nowrap;padding:2px}
.heat td.rowh{position:sticky;left:0;background:var(--surface);white-space:nowrap;padding-right:8px;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--link)}
.heat td.c{width:16px;min-width:16px;height:16px;border-radius:4px}
.heat td.c.ok{background:var(--ok)}.heat td.c.warn{background:var(--warn)}.heat td.c.bad{background:var(--bad)}.heat td.c.muted{background:var(--muted)}.heat td.c.e{background:var(--mutedbg)}
.heat td.c[role=button]:hover{outline:2px solid var(--link)}
.funnel .row{display:grid;grid-template-columns:220px minmax(0,1fr) 60px;gap:10px;align-items:center;margin:8px 0}
.funnel .fill{height:20px;border-radius:999px;background:var(--grad);opacity:.85;min-width:4px}

/* The side panel of a test, a run, an issue or a scenario. */
#drawer{position:fixed;inset:0 0 0 auto;width:min(var(--dw,max(360px,50vw)),100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow2);overflow:auto;z-index:20;padding:14px 18px 48px;animation:qi-in .18s ease-out}
@keyframes qi-in{from{transform:translateX(24px)}to{transform:none}}
#scrim{position:fixed;inset:0;background:rgba(20,16,50,.28);z-index:19}
/* Drag the panel's left edge to make it wider or narrower; the width stays in this browser. */
#dgrip{position:fixed;top:0;bottom:0;right:min(var(--dw,max(360px,50vw)),100%);width:10px;transform:translateX(50%);cursor:col-resize;z-index:21;touch-action:none}
#dgrip::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:2px;background:transparent;transition:background .15s}
#dgrip:hover::after,#dgrip:focus-visible::after,#dgrip.drag::after{background:var(--link)}
body.dragging{user-select:none;cursor:col-resize}
@media (max-width:700px){#dgrip{display:none}}
#drawer h2{font-size:18px;margin:6px 0;letter-spacing:-.01em}
.dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:12px 0}
.dl dt{color:var(--dim)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.gwt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:10px 0}
.gwt p{margin:4px 0}
.gwt b{display:inline-block;width:56px;color:var(--dim);font-weight:600}
.gwt .quote{margin:8px 0 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--dim);font-size:13px}
.gwt .quote b{width:auto;margin-right:6px}
.steps{list-style:none;padding:0;margin:8px 0 8px 8px;border-left:2px solid var(--line)}
.steps li{position:relative;padding:4px 0 4px 22px;overflow-wrap:anywhere}
.steps li::before{content:attr(data-k);position:absolute;left:-10px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:9px;text-align:center;line-height:17px;color:var(--dim)}
.steps li.expect{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.hist{display:flex;flex-wrap:wrap;gap:3px}
.hist span{font-size:11px;border-radius:3px;padding:0 5px}
.sec{margin-top:18px}
.sec h3{font-size:12px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:4px;align-items:center}
#legend{position:fixed;right:16px;top:70px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);padding:14px;max-width:min(460px,calc(100% - 32px));max-height:80vh;overflow:auto}
#legend ul{list-style:none;padding:0;margin:6px 0 12px}
#legend li{margin:5px 0}
.close{float:right}
.asof{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warnbg);color:var(--warn);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:13px}

/* Product map. */
.maplayout{display:grid;grid-template-columns:220px minmax(0,1fr) 330px;gap:16px;align-items:start}
.pagelist{max-height:78vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;box-shadow:var(--shadow)}
.pagelist h4{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}
.pagelist button{display:flex;gap:6px;align-items:center;width:100%;background:none;border:0;border-radius:8px;padding:5px 6px;cursor:pointer;text-align:left}
.pagelist button:hover{background:var(--card)}
.pagelist button[aria-current=true]{background:var(--sel);font-weight:600}
.pagelist .n{margin-left:auto;color:var(--dim);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--bad)}
.dot.regression{background:var(--ok)}.dot.exploratory{background:var(--warn)}
.pagepick{display:none;margin-bottom:8px;max-width:100%}
.stage{position:relative;width:100%;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.stage img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.stage.wf{background:var(--card);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.hs{position:absolute;border:2px solid var(--muted);border-radius:4px;background:color-mix(in srgb,var(--muted) 14%,transparent);cursor:pointer;padding:0;overflow:hidden;min-width:6px;min-height:6px;transition:outline-color .1s}
.hs:hover,.hs.sel{outline:3px solid var(--link);outline-offset:1px;z-index:3}
.hs.go{cursor:alias}
.hs.go::after{content:"↗";position:absolute;right:1px;top:-2px;font-size:10px;font-weight:700;color:var(--link)}
.hs.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.hs.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.hs.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,transparent)}
.hs.none{border:2px dashed var(--link);background:color-mix(in srgb,var(--link) 7%,transparent)}
.stage.wf .hs{background:var(--surface)}
.hs span{display:block;font-size:10px;line-height:1.2;padding:1px 3px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.legend-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--dim);margin:8px 0}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;border:2px solid var(--muted);vertical-align:middle;margin-right:4px}
.sw.ok{border-color:var(--ok)}.sw.warn{border-color:var(--warn)}.sw.bad{border-color:var(--bad)}.sw.none{border:2px dashed var(--link)}
.cells{display:inline-flex;gap:2px;vertical-align:middle}
.cells i{width:9px;height:12px;border-radius:2px;background:var(--mutedbg)}
.cells i.ok{background:var(--ok)}.cells i.warn{background:var(--warn)}.cells i.bad{background:var(--bad)}.cells i.muted{background:var(--muted)}
pre.diff{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:12px;max-height:50vh;overflow:auto}

/* Modules, findings, design. */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.mod header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.mod header h3{font-size:15px;margin:0}
.mod p{margin:0}
.set{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px;margin:0}
.set dt{color:var(--dim);overflow-wrap:anywhere}.set dd{margin:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.set input{width:9ch;padding:3px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.set input.wide{width:min(26ch,100%)}
.pending{background:var(--agentbg);border:1px solid color-mix(in srgb,var(--agent) 40%,transparent);border-radius:var(--r);padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.note{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--agent);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--dim)}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.dcard img{width:100%;display:block;border-radius:8px;border:1px solid var(--line);background:#fff}
.dcard .saw{font-weight:600;overflow-wrap:anywhere}
.dcard details summary{cursor:pointer;color:var(--link);font-size:12.5px}
.ask textarea{width:100%;min-height:96px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;resize:vertical}
.ask{display:flex;flex-direction:column;gap:6px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.guide{margin-bottom:16px}.guide summary{cursor:pointer;font-weight:600}.guide dl{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:8px 14px;font-size:13px;margin:12px 0 0}.guide dt{font-weight:600}.guide dd{margin:0;color:var(--dim)}
@media (max-width:520px){.guide dl{grid-template-columns:minmax(0,1fr)}}

/* Actions: what you can ask the agent for — a title, what happens, the command. */
.actions{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.action{border:1px solid color-mix(in srgb,var(--agent) 25%,var(--line));border-radius:var(--r);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.action b{font-size:13.5px}.action p{margin:0;color:var(--dim);font-size:12.5px}
.action.hot{border-left:5px solid var(--bad)}
.action.info{border-color:var(--line);background:var(--card)}
.action .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.action input,.action select{padding:3px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;max-width:100%}
.action input{flex:1 1 12ch}
.found{display:inline-flex;gap:4px;align-items:center;font-size:12px;border:1px solid color-mix(in srgb,var(--ext) 40%,var(--line));border-radius:999px;padding:0 9px;white-space:nowrap;background:var(--extbg);text-decoration:none}
.pick{width:16px;height:16px;cursor:pointer;accent-color:var(--agent);vertical-align:middle;margin:0}
.dcard.picked,.card.picked,tr.picked{outline:2px solid var(--agent);outline-offset:-2px}
#tray{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:18;width:min(980px,calc(100% - 24px));background:var(--surface);border:2px solid var(--agent);border-radius:16px;box-shadow:var(--shadow2);padding:10px 14px;display:flex;flex-direction:column;gap:8px;max-height:45vh;overflow:auto;animation:qi-up .2s ease-out}
@keyframes qi-up{from{transform:translate(-50%,12px)}to{transform:translateX(-50%)}}
#tray .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#tray .chip button{background:none;border:0;cursor:pointer;color:var(--dim);padding:0 0 0 2px}
body.has-tray main{padding-bottom:230px}

/* Test builder: the steps as blocks or as text at the left, each step on the product's screens at the right. */
.blayout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.bsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bstep{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:var(--r);padding:8px 10px;box-shadow:var(--shadow);transition:box-shadow .12s}
.bstep.k-given{border-left-color:var(--dim)}.bstep.k-open{border-left-color:var(--link)}.bstep.k-do{border-left-color:var(--agent)}.bstep.k-check{border-left-color:var(--ok)}
.bstep.cur{outline:2px solid var(--link);outline-offset:1px}
.bstep.drag{opacity:.45}.bstep.over{box-shadow:0 -4px 0 var(--link)}
.bstep .grip{cursor:grab;color:var(--dim);background:none;border:0;padding:2px 4px;font-size:16px;line-height:1;border-radius:6px}
.bstep .grip:hover{background:var(--card);color:var(--fg)}
.bstep .num{width:22px;height:22px;border-radius:50%;background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--dim)}
.bstep .bbody{display:flex;gap:6px;align-items:center;min-width:0}
.bstep select{flex:none;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px}
.bstep input{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.bstep .tools{display:flex;gap:2px}
.bstep .tools button{background:none;border:0;border-radius:6px;padding:3px 6px;cursor:pointer;color:var(--dim)}
.bstep .tools button:hover{background:var(--card);color:var(--fg)}
.bstep .tools button:disabled{opacity:.3;cursor:default;background:none}
.badd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.badd select{padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);max-width:100%}
.btext{width:100%;min-height:280px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7;resize:vertical}
.bname{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin-bottom:10px}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:999px;padding:3px 12px;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.bcap{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;font-size:14px;min-height:44px}
.bcap .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.bcap b{display:block}
.bstage{position:relative}
.bstage .hs.step{border:3px solid var(--agent);background:color-mix(in srgb,var(--agent) 20%,transparent);z-index:4;animation:qi-ring 1.6s infinite}
.bstage .hs.mute{border:1px solid color-mix(in srgb,var(--dim) 40%,transparent);background:transparent;pointer-events:none}
.bstage .hs.rec{border:2px dashed var(--agent);background:color-mix(in srgb,var(--agent) 6%,transparent);cursor:copy}
.bstage .hs.rec:hover{background:color-mix(in srgb,var(--agent) 22%,transparent)}
@keyframes qi-ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--agent) 55%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.bcheck{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;background:var(--okbg);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 50%,transparent);border-radius:10px;padding:6px 10px;font-weight:600;box-shadow:var(--shadow2);overflow-wrap:anywhere}
.bph{aspect-ratio:16/10;flex-direction:column;gap:6px;padding:20px;text-align:center;font-size:13.5px}
.bph .em{font-size:34px}
.bplay{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px}
.film{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:thin}
.film button{flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-start;width:118px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;text-align:left;font-size:11.5px;color:var(--dim)}
.film button[aria-current=true]{border-color:var(--link);background:var(--sel);color:var(--fg)}
