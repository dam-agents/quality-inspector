# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
# kit.yaml — the platform's Starter Kit for quality-inspector.
#
# This repository IS the kit: the platform reads this file out of git, creates the
# agent from it, seeds this definition into $HOME, and opens the first session on
# ONBOARDING.md. Keep the schedules here in step with CLAUDE.md's run-types table and
# ONBOARDING Step 5 — same names, same task text.

schemaVersion: v1
id: quality-inspector
name: Quality Inspector
description: >-
  Black-box QA for any product with a web UI, through a product profile skill. For every
  GitHub issue carrying the QA label it freezes acceptance criteria from the issue's
  "Done when" section, brings the newest build up inside its own VM, drives it through
  the built-in Chromium with the e2e framework (Playwright plus an LLM fallback with a
  replay cache), checks each criterion red-green against the last release, and publishes
  a per-criterion verdict with video evidence. Nightly it replays promoted tests with
  awareness of what changed, telling redesigns from regressions. In a Slack channel it
  tests the scenarios people describe and queues them for the regression on request, and
  it can propose scenarios of its own; an independent judge sub-agent checks every
  scenario and every scenario verdict. It never reads the product's source code.
category: software
tagline: Tests issues through the UI against a nested build, without reading the code.
icon: flask
docsUrl: https://github.com/dam-agents/quality-inspector

seed:
  self: true
  into: home

connections:
  - accepts: [github]
    required: true
    note: >-
      Reads issues of the target repository (and the profile's skill source when it is
      private) and, when issue comments are enabled,
      posts verdict comments and removes the retest label; with `work_repo`, it pushes
      the backup of work/ to that private repository. Egress rules must confine it to
      the issues endpoints of the target (README → Black-box boundary).

# The gateway injects a connection's credential only into a request that carries its
# placeholder. The nested product's own traffic (image pulls, its installers, a lent model)
# leaves through the same gateway, and with injection into every request it would go out
# as this agent's GitHub and model accounts; the Browser Panel (live_browser) needs it too.
# The agent's own calls send the placeholders the platform gives it (lib/profile.sh → model_auth).
requireConnectionAddress: true

# Optional. Bound, the channel carries two kinds of request (docs/slack.md, docs/scenarios.md);
# onboarding records it as `slack_channel` when people there may order "test #N".
channels:
  - type: slack
    note: >-
      Optional. Connect a channel where people ask for scenarios to be tested ("test that
      …"); anyone in it may ask, within max_scenarios_per_day. Recorded as slack_channel,
      people in it may also order an issue test ("test #N", within slack_tests_per_day) and
      get the report in their thread. With scenario_channel set, the weekly scenario
      proposals land there too. Skip it to keep everything in chat.

schedules:
  - name: quality-inspector-issues-1h
    cron: "7 * * * *"
    sessionMode: fresh
    precheck: 'bash "$HOME/scripts/precheck.sh" issues'
    task: >-
      QA issues run. Run `bash "$HOME/scripts/preflight.sh" issues` first unless its
      worklist is already appended below. If its JSON says nothing_to_do, report its
      logs in one line and end the run. Otherwise follow CLAUDE.md → "Issues run":
      read docs/issue-qa.md and process every issues_due and reports_due entry.
  - name: quality-inspector-regression-nightly
    cron: "0 3 * * *"
    sessionMode: fresh
    enabled: false
    precheck: 'bash "$HOME/scripts/precheck.sh" regression'
    task: >-
      QA regression run. Run `bash "$HOME/scripts/preflight.sh" regression` first
      unless its worklist is already appended below. If its JSON says nothing_to_do,
      report its logs in one line and end the run. Otherwise follow CLAUDE.md →
      "Regression run": read docs/regression.md and replay the regression tier
      against the worklist's candidate.
  - name: quality-inspector-benchmark-monthly
    cron: "0 2 1 * *"
    sessionMode: fresh
    enabled: false
    precheck: 'bash "$HOME/scripts/precheck.sh" benchmark'
    task: >-
      QA benchmark run. Run `bash "$HOME/scripts/preflight.sh" benchmark` first unless
      its worklist is already appended below. If its JSON says nothing_to_do, report its
      logs in one line and end the run. Otherwise follow CLAUDE.md → "Benchmark run":
      read docs/benchmark.md and run every case.
  - name: quality-inspector-security-weekly
    cron: "0 4 * * 0"
    sessionMode: fresh
    enabled: false
    precheck: 'bash "$HOME/scripts/precheck.sh" security'
    task: >-
      QA security run. Run `bash "$HOME/scripts/preflight.sh" security` first unless its
      worklist is already appended below. If its JSON says nothing_to_do, report its
      logs in one line and end the run. Otherwise follow CLAUDE.md → "Security run":
      read docs/security.md and run every check against the worklist's candidate.
  - name: quality-inspector-scenarios-weekly
    cron: "0 6 * * 3"
    sessionMode: fresh
    enabled: false
    precheck: 'bash "$HOME/scripts/precheck.sh" discovery'
    task: >-
      Scenario discovery run. Run `bash "$HOME/scripts/preflight.sh" discovery` first
      unless its worklist is already appended below. If its JSON says nothing_to_do,
      report its logs in one line and end the run. Otherwise follow CLAUDE.md →
      "Scenario discovery run": read docs/scenarios.md → Discovery and propose scenarios.
  - name: quality-inspector-audit-weekly
    cron: "0 7 * * 5"
    sessionMode: fresh
    enabled: false
    precheck: 'bash "$HOME/scripts/precheck.sh" audit'
    task: >-
      Weekly self-audit. Run `bash "$HOME/scripts/preflight.sh" audit`, then follow
      CLAUDE.md → "Audit run": read docs/audit.md and report.
  - name: quality-inspector-modules-nightly
    cron: "30 4 * * *"
    sessionMode: fresh
    precheck: 'bash "$HOME/scripts/precheck.sh" modules'
    task: >-
      Testing modules run. Run `bash "$HOME/scripts/preflight.sh" modules` first unless
      its worklist is already appended below. If its JSON says nothing_to_do, report its
      logs in one line and end the run. Otherwise follow CLAUDE.md → "Modules run": read
      docs/modules.md and run every due module against the worklist's candidate.

# The black-box boundary, the same for every target (docs/black-box.md → Egress rules): GitHub
# is deny-by-default, and what opens opens for every repository alike — the issues endpoints,
# the profile directory `.quality-inspector/`, a repository's metadata and head ref, and the
# read-only git fetch of this definition (seed and Kit Update). No rule names the target, so
# no operator step is needed; the black-box gate in scripts/preflight.sh proves them before
# every day's work. The block between the markers is `github_rules github.com
# dam-agents/quality-inspector` of scripts/lib/boundary.sh, verbatim (validate-definition.sh
# compares). The `trusted` preset and the GitHub connection allow github.com, api.github.com,
# codeload, raw, gitlab.com and codeberg.org host-wide (method and path "*") before these
# rules are written, and a kit rule that contradicts a rule already there fails the apply.
# So every deny names a path — "/*" for a whole host — which also outranks their "*".
egressPreset: trusted
egressRules:
  - host: registry.npmjs.org
    method: GET
  - host: api.anthropic.com
  # >>> github_rules
  - host: api.github.com
    pathPattern: "/*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/user"
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*"
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*_2F*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/issues*"
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/*/issues*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*_2F*/issues*"
    verdict: deny
  - host: api.github.com
    method: POST
    pathPattern: "/repos/*/*/issues/*/comments"
  - host: api.github.com
    method: POST
    pathPattern: "/repos/*/*/*/issues/*/comments"
    verdict: deny
  - host: api.github.com
    method: POST
    pathPattern: "/repos/*_2F*/issues/*/comments"
    verdict: deny
  - host: api.github.com
    method: DELETE
    pathPattern: "/repos/*/*/issues/*/labels/*"
  - host: api.github.com
    method: DELETE
    pathPattern: "/repos/*/*/*/issues/*/labels/*"
    verdict: deny
  - host: api.github.com
    method: DELETE
    pathPattern: "/repos/*_2F*/issues/*/labels/*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/contents/.quality-inspector/*"
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/*/contents/.quality-inspector/*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*_2F*/contents/.quality-inspector/*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/contents/.quality-inspector?*"
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/*/contents/.quality-inspector?*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*_2F*/contents/.quality-inspector?*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/git/refs/heads/*"
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/*/git/refs/heads/*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*_2F*/git/refs/heads/*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/issues/*/timeline*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/issues/*/events*"
    verdict: deny
  - host: api.github.com
    method: GET
    pathPattern: "/repos/*/*/issues/events*"
    verdict: deny
  - host: github.com
    pathPattern: "/*"
    verdict: deny
  - host: github.com
    method: GET
    pathPattern: "/dam-agents/quality-inspector*/info/refs?service=git-upload-pack"
  - host: github.com
    method: POST
    pathPattern: "/dam-agents/quality-inspector*/git-upload-pack"
  - host: codeload.github.com
    pathPattern: "/*"
    verdict: deny
  # <<< github_rules
  # Cluster prerequisites a helm-k3s profile applies (engines/helm-k3s → Prerequisites): one
  # release file each, through the github.com deny above; the download redirects to
  # release-assets.githubusercontent.com, which the trusted preset allows.
  - host: github.com
    method: GET
    pathPattern: "/cert-manager/cert-manager/releases/download/v*/cert-manager.yaml"
  - host: github.com
    method: GET
    pathPattern: "/kubernetes-sigs/gateway-api/releases/download/v*/standard-install.yaml"
  # Code hosts this agent never needs.
  - host: raw.githubusercontent.com
    pathPattern: "/*"
    verdict: deny
  - host: gist.githubusercontent.com
    pathPattern: "/*"
    verdict: deny
  - host: gist.github.com
    pathPattern: "/*"
    verdict: deny
  - host: gitlab.com
    pathPattern: "/*"
    verdict: deny
  - host: "*.gitlab.com"
    pathPattern: "/*"
    verdict: deny
  - host: bitbucket.org
    pathPattern: "/*"
    verdict: deny
  - host: "*.bitbucket.org"
    pathPattern: "/*"
    verdict: deny
  - host: codeberg.org
    pathPattern: "/*"
    verdict: deny
  - host: gitea.com
    pathPattern: "/*"
    verdict: deny
  - host: dev.azure.com
    pathPattern: "/*"
    verdict: deny
  - host: "*.visualstudio.com"
    pathPattern: "/*"
    verdict: deny
  - host: sourcegraph.com
    pathPattern: "/*"
    verdict: deny
  - host: git.sr.ht
    pathPattern: "/*"
    verdict: deny

# A nested product runs a container runtime or a whole cluster (engines/helm-k3s needs
# root), which an agent container cannot host: a kit that names no backend is created
# as a container. On an install without virtualization the catalog hides the kit.
backend: vm

resources:
  cpu: "8"
  memory: 12Gi
  storage: 80Gi
  note: >-
    A full product stack nested in the VM plus Chromium, with disk for two builds
    (candidate and baseline, installed one at a time) and the e2e evidence; the
    profile's README states what its product needs. Memory is no more than a profile
    measures (`requires.memory_gi`) on purpose: on a laptop host runner it is the
    machine's size, and a VM filling spare memory with file cache pushes the host into
    swap until the runner restarts it. A cluster runner sizes the machine from the
    owner's pool instead.

harnesses: [claude-code]
